name: todaily
description: "Daily Journal."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+05

environment:
  sdk: ^3.11.5

dependencies:
  firebase_ai: ^3.12.1
  firebase_core: ^4.9.0
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_quill: ^11.5.0
  flutter_secure_storage: ^10.2.0
  google_fonts: ^8.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  hugeicons: ^1.1.7
  image_picker: ^1.2.2
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  signals: ^6.3.0
  toastification: ^3.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.11.1
  very_good_analysis: ^10.2.0

flutter_native_splash:
  # dart run flutter_native_splash:create
  color: "#dedede"
  color_dark: "#dedede"
  image: assets/icons/todailyIcon.png
  android_gravity: center
  ios_content_mode: center
  web_image_mode: center
  android_screen_orientation: sensorPortrait
  fullscreen: true
  # ANDROID 12+ configuration:
  android_12:
    # background color
    color: "#dedede"
    color_dark: "#dedede"
    image: assets/icons/todailyIcon.png
    image_dark: assets/icons/todailyIcon.png
    icon_background_color: "#dedede"
    icon_background_color_dark: "#dedede"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
